<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記帳本" />
  <title>記帳本</title>
  <style>
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --income: #16a34a;
      --expense: #dc2626;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-text-size-adjust: 100%;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: calc(env(safe-area-inset-top) + 16px) 16px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    .container { max-width: 560px; margin: 0 auto; padding: 16px; }

    /* ---- Summary ---- */
    .period-tabs {
      display: flex;
      background: var(--card);
      border-radius: 12px;
      padding: 4px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .period-tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 10px;
      font-size: .95rem;
      font-weight: 600;
      color: var(--muted);
      border-radius: 9px;
      cursor: pointer;
    }
    .period-tabs button.active { background: var(--primary); color: #fff; }

    .summary-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .summary-label { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .summary-balance { font-size: 2rem; font-weight: 800; letter-spacing: -.5px; }
    .summary-split { display: flex; gap: 12px; margin-top: 14px; }
    .summary-split > div {
      flex: 1;
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .summary-split .amt { font-size: 1.1rem; font-weight: 700; }
    .income { color: var(--income); }
    .expense { color: var(--expense); }

    /* ---- Form ---- */
    .add-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-toggle button {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .type-toggle button.sel-expense { border-color: var(--expense); color: var(--expense); background: #fef2f2; }
    .type-toggle button.sel-income { border-color: var(--income); color: var(--income); background: #f0fdf4; }

    label { display: block; font-size: .8rem; color: var(--muted); margin: 0 0 5px 2px; }
    .field { margin-bottom: 12px; }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cat-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 10px 4px;
      font-size: .75rem;
      cursor: pointer;
      text-align: center;
      color: var(--text);
    }
    .cat-btn .ico { display: block; font-size: 1.4rem; margin-bottom: 2px; }
    .cat-btn.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 700; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-btn:active { opacity: .85; }

    /* ---- List ---- */
    .list-title { font-size: .9rem; font-weight: 700; color: var(--muted); margin: 4px 2px 10px; }
    .day-group { margin-bottom: 14px; }
    .day-head {
      display: flex; justify-content: space-between;
      font-size: .8rem; color: var(--muted); padding: 0 4px 6px;
    }
    .record {
      display: flex; align-items: center; gap: 12px;
      background: var(--card);
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 8px;
    }
    .record .ico {
      width: 40px; height: 40px; flex: 0 0 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); border-radius: 50%; font-size: 1.2rem;
    }
    .record .meta { flex: 1; min-width: 0; }
    .record .cat { font-weight: 600; font-size: .95rem; }
    .record .note { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record .amt { font-weight: 700; font-size: 1rem; white-space: nowrap; }
    .record .del {
      border: 0; background: transparent; color: var(--muted);
      font-size: 1.2rem; cursor: pointer; padding: 4px 2px 4px 6px;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: .9rem; }
  </style>
</head>
<body>
  <header><h1>💰 我的記帳本</h1></header>
  <div class="container">

    <!-- 期間切換 -->
    <div class="period-tabs">
      <button id="tab-week" class="active" onclick="setPeriod('week')">本週</button>
      <button id="tab-month" onclick="setPeriod('month')">本月</button>
    </div>

    <!-- 總覽 -->
    <div class="summary-card">
      <div class="summary-label" id="sum-label">本週結餘</div>
      <div class="summary-balance" id="sum-balance">$0</div>
      <div class="summary-split">
        <div>
          <div class="summary-label">收入</div>
          <div class="amt income" id="sum-income">$0</div>
        </div>
        <div>
          <div class="summary-label">支出</div>
          <div class="amt expense" id="sum-expense">$0</div>
        </div>
      </div>
    </div>

    <!-- 新增 -->
    <div class="add-card">
      <div class="type-toggle">
        <button id="btn-expense" class="sel-expense" onclick="setType('expense')">支出</button>
        <button id="btn-income" onclick="setType('income')">收入</button>
      </div>

      <div class="field">
        <label>分類</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>

      <div class="field">
        <label for="amount">金額</label>
        <input id="amount" type="number" inputmode="decimal" min="0" step="1" placeholder="0" />
      </div>

      <div class="field">
        <label for="date">消費日期</label>
        <input id="date" type="date" />
      </div>

      <div class="field">
        <label for="note">備註（選填）</label>
        <input id="note" type="text" placeholder="例如：午餐、捷運" maxlength="40" />
      </div>

      <button class="submit-btn" onclick="addRecord()">＋ 新增記錄</button>
    </div>

    <!-- 明細 -->
    <div class="list-title" id="list-title">本週明細</div>
    <div id="record-list"></div>
  </div>

  <script>
    // ---------- 分類定義 ----------
    const CATEGORIES = {
      expense: [
        { key: '食物', ico: '🍜' },
        { key: '交通', ico: '🚌' },
        { key: '購物', ico: '🛍️' },
        { key: '居家', ico: '🏠' },
        { key: '娛樂', ico: '🎮' },
        { key: '醫療', ico: '💊' },
        { key: '教育', ico: '📚' },
        { key: '其他', ico: '📦' },
      ],
      income: [
        { key: '薪資', ico: '💼' },
        { key: '獎金', ico: '🎁' },
        { key: '投資', ico: '📈' },
        { key: '其他', ico: '💵' },
      ],
    };
    const ICO_MAP = {};
    [...CATEGORIES.expense, ...CATEGORIES.income].forEach(c => { ICO_MAP[c.key] = c.ico; });

    const STORE_KEY = 'expense_tracker_records_v1';
    let records = load();
    let currentType = 'expense';
    let currentCat = CATEGORIES.expense[0].key;
    let currentPeriod = 'week';

    // ---------- 儲存 ----------
    function load() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch (e) { return []; }
    }
    function save() { localStorage.setItem(STORE_KEY, JSON.stringify(records)); }

    // ---------- 工具 ----------
    function fmt(n) {
      const sign = n < 0 ? '-' : '';
      return sign + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
    }
    function todayStr() {
      const d = new Date();
      const off = d.getTimezoneOffset();
      return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
    }
    // 本週起點（週一）
    function weekStart(date) {
      const d = new Date(date + 'T00:00:00');
      const day = (d.getDay() + 6) % 7; // 週一=0
      d.setDate(d.getDate() - day);
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function inCurrentPeriod(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      if (currentPeriod === 'month') {
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      }
      const ws = weekStart(todayStr());
      const we = new Date(ws); we.setDate(we.getDate() + 7);
      return d >= ws && d < we;
    }

    // ---------- 渲染分類按鈕 ----------
    function renderCats() {
      const grid = document.getElementById('cat-grid');
      grid.innerHTML = '';
      CATEGORIES[currentType].forEach(c => {
        const b = document.createElement('button');
        b.className = 'cat-btn' + (c.key === currentCat ? ' active' : '');
        b.innerHTML = `<span class="ico">${c.ico}</span>${c.key}`;
        b.onclick = () => { currentCat = c.key; renderCats(); };
        grid.appendChild(b);
      });
    }

    function setType(t) {
      currentType = t;
      currentCat = CATEGORIES[t][0].key;
      document.getElementById('btn-expense').className = t === 'expense' ? 'sel-expense' : '';
      document.getElementById('btn-income').className = t === 'income' ? 'sel-income' : '';
      renderCats();
    }

    function setPeriod(p) {
      currentPeriod = p;
      document.getElementById('tab-week').classList.toggle('active', p === 'week');
      document.getElementById('tab-month').classList.toggle('active', p === 'month');
      document.getElementById('sum-label').textContent = p === 'week' ? '本週結餘' : '本月結餘';
      document.getElementById('list-title').textContent = p === 'week' ? '本週明細' : '本月明細';
      render();
    }

    // ---------- 新增 ----------
    function addRecord() {
      const amtEl = document.getElementById('amount');
      const amount = parseFloat(amtEl.value);
      if (!amount || amount <= 0) { alert('請輸入正確的金額'); amtEl.focus(); return; }
      const date = document.getElementById('date').value || todayStr();
      const note = document.getElementById('note').value.trim();
      records.push({
        id: Date.now() + '' + Math.floor(Math.random() * 1000),
        type: currentType,
        category: currentCat,
        amount: amount,
        date: date,
        note: note,
      });
      save();
      amtEl.value = '';
      document.getElementById('note').value = '';
      render();
    }

    function delRecord(id) {
      if (!confirm('確定要刪除這筆記錄嗎？')) return;
      records = records.filter(r => r.id !== id);
      save();
      render();
    }

    // ---------- 渲染總覽 + 明細 ----------
    function render() {
      const list = records.filter(r => inCurrentPeriod(r.date));
      let income = 0, expense = 0;
      list.forEach(r => { if (r.type === 'income') income += r.amount; else expense += r.amount; });

      document.getElementById('sum-income').textContent = fmt(income);
      document.getElementById('sum-expense').textContent = fmt(expense);
      const bal = income - expense;
      const balEl = document.getElementById('sum-balance');
      balEl.textContent = fmt(bal);
      balEl.style.color = bal >= 0 ? 'var(--income)' : 'var(--expense)';

      // 依日期分組（新到舊）
      const container = document.getElementById('record-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">這個期間還沒有記錄<br>從上方新增第一筆吧 ✍️</div>';
        return;
      }
      const groups = {};
      list.forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });
      const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

      let html = '';
      dates.forEach(date => {
        const items = groups[date];
        let dayIn = 0, dayOut = 0;
        items.forEach(r => { if (r.type === 'income') dayIn += r.amount; else dayOut += r.amount; });
        const dObj = new Date(date + 'T00:00:00');
        const wd = ['日', '一', '二', '三', '四', '五', '六'][dObj.getDay()];
        html += `<div class="day-group">
          <div class="day-head">
            <span>${date}（週${wd}）</span>
            <span>${dayIn ? '<span class="income">+' + fmt(dayIn) + '</span> ' : ''}${dayOut ? '<span class="expense">-' + fmt(dayOut) + '</span>' : ''}</span>
          </div>`;
        items.sort((a, b) => b.id.localeCompare(a.id)).forEach(r => {
          const sign = r.type === 'income' ? '+' : '-';
          const cls = r.type === 'income' ? 'income' : 'expense';
          html += `<div class="record">
            <div class="ico">${ICO_MAP[r.category] || '📦'}</div>
            <div class="meta">
              <div class="cat">${r.category}</div>
              ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
            </div>
            <div class="amt ${cls}">${sign}${fmt(r.amount)}</div>
            <button class="del" onclick="delRecord('${r.id}')">🗑️</button>
          </div>`;
        });
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- 初始化 ----------
    document.getElementById('date').value = todayStr();
    renderCats();
    render();
  </script>
</body>
</html>
